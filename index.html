function render(){const groups=['Fontes','Pads'];document.querySelector('#app').innerHTML=`<header class="header"><div class="brand"><span class="brand-mark">≋</span> PAD CONSOLE</div><div class="actions"><button class="admin-btn" id="openAdmin" aria-label="Enviar áudio" title="Enviar áudio">⚙</button><div class="status ${state.playing?'on':''}"><i></i>${state.playing?'ON':'READY'}</div></div></header><section id="tonality" class="transport panel"><div><div class="caption">TONALIDADE</div><div class="root-readout">${esc(state.root)}</div></div><div><div class="caption">TRANSPOR</div><div class="keys">${KEYS.map((k,i)=>`<button class="key ${k===state.root?'active':''}" data-root="${k}"><span>${k}</span><small>${'1234567890-='[i]}</small></button>`).join('')}</div></div><div class="transport-buttons"><button class="play" id="play">${state.playing?'Ⅱ':'▶'}</button><button class="stop" id="stop">◉</button></div></section><section id="masterPanel" class="master panel"><div class="master-head"><span>◖ MASTER VOLUME</span><b>${Math.round(state.master*100)}%</b></div><input id="master" class="range" type="range" min="0" max="1" step=".001" value="${state.master}"></section><div class="mixer-head" id="presetSection"><strong>☷ MIXER <span style="font-weight:400;color:#6d7a87">30 canais</span></strong><div class="preset-tools"><input id="presetName" placeholder="Nome do preset"><button id="savePreset">Salvar</button><select id="loadPreset"><option value="">Carregar</option>${state.presets.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><button id="reset">Restaurar</button></div></div><div class="groups" id="mixerGroups">${groups.map(group=>`<section id="category-${group==='Fontes'?'fontes':'pads'}" class="group panel"><h2>${group}</h2><div class="channel-grid">${channels.filter(c=>c[2]===group).map(c=>`<div class="channel"><div class="channel-head"><span>${c[1]}</span><b data-value="${c[0]}">${Math.round(state.volumes[c[0]]*100)}</b></div><input type="range" min="0" max="1" step=".001" value="${state.volumes[c[0]]}" data-channel="${c[0]}"></div>`).join('')}</div></section>`).join('')}</div><footer class="footer">PAD CONSOLE • FIRESTORE</footer><nav class="bottom-nav" aria-label="Navegação principal"><a class="nav-item" href="#category-pads"><span>♫</span><span>Pads</span></a><a class="nav-item" href="#presetSection"><span>▤</span><span>Presets</span></a><a class="nav-item" href="#mixerGroups"><span>☷</span><span>Mixer</span></a><a class="nav-item nav-admin" href="#openAdmin" onclick="document.getElementById('openAdmin').click();return false"><span>⚙</span><span>Admin</span></a></nav>${state.modal?modalHtml():''}`;bind()}
function modalHtml(){const docs=new Map(state.audioDocs.map(a=>[`${a.root}__${a.id}`,a]));return `<div class="modal-backdrop" id="backdrop"><section class="modal"><div class="modal-head"><div><small>ADMINISTRAÇÃO</small><h2>Enviar áudio</h2></div><button class="close" id="close">×</button></div><p class="note">O arquivo será salvo exatamente no cruzamento nota + canal. Use GLOBAL para bateria compartilhada. Limite: 700 KB por arquivo.</p><div class="steps"><span>1 · NOTA</span><span>2 · CANAL</span><span>3 · ARQUIVO</span></div><div class="upload-row"><select id="audioRoot">${UPLOAD_ROOTS.map(k=>`<option ${k===state.selectedRoot?'selected':''}>${k}</option>`).join('')}</select><select id="audioChannel">${channels.map(c=>`<option value="${c[0]}" ${c[0]===state.selectedChannel?'selected':''}>${c[1]}</option>`).join('')}</select><label class="file-btn">Escolher áudio<input id="audioFile" type="file" accept="audio/mpeg,audio/ogg,audio/wav,audio/mp4"></label></div><p class="message" id="message"></p><div class="audio-list">${channels.map(c=>{const a=docs.get(`${state.selectedRoot}__${c[0]}`);return `<div class="audio-row"><span><i class="led ${a?'on':''}"></i>${c[1]}</span>${a?`<button data-delete="${c[0]}">Excluir</button>`:'<small>vazio</small>'}</div>`}).join('')}</div></section></div>`}
let ctx=null,masterNode=null,voices=new Map(),buffers=new Map(),audioDocsForRoot=new Map(),loadedAudioRoot=null,switchToken=0,globalAudioPromise=null;
const audioDocsByRoot=new Map(),bufferPromises=new Map(),bufferGenerations=new Map(),MAX_CACHED_ROOTS=2,MAX_CACHED_BUFFERS=24,MAX_CACHED_AUDIO_BYTES=64*1024*1024;
const channelVolumeTokens=new Map();
let cachedAudioBytes=0;
const freq={C:130.81,'C#':138.59,D:146.83,'D#':155.56,E:164.81,F:174.61,'F#':185,G:196,'G#':207.65,A:220,'A#':233.08,B:246.94};
function initAudio(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();masterNode=ctx.createGain();const comp=ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=8;comp.attack.value=.006;comp.release.value=.28;const limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-4;limiter.ratio.value=20;limiter.attack.value=.001;masterNode.connect(comp).connect(limiter).connect(ctx.destination);masterNode.gain.value=.0001}
function decodeAudio(b64){const raw=b64.includes(',')?b64.split(',')[1]:b64;const bin=atob(raw);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return ctx.decodeAudioData(bytes.buffer)}
function snapshotAudioMap(snap){const map=new Map();for(const d of snap.docs){const a=d.data();if(a.base64&&channels.some(c=>c[0]===a.id))map.set(a.id,a)}return map}
function rootAudioMap(root){let promise=audioDocsByRoot.get(root);if(promise){audioDocsByRoot.delete(root);audioDocsByRoot.set(root,promise);return promise}promise=db.collection('channelAudio').where('root','==',root).get().then(snapshotAudioMap).catch(e=>{audioDocsByRoot.delete(root);throw e});audioDocsByRoot.set(root,promise);while(audioDocsByRoot.size>MAX_CACHED_ROOTS)audioDocsByRoot.delete(audioDocsByRoot.keys().next().value);return promise}
function globalAudioMap(){if(!globalAudioPromise)globalAudioPromise=db.collection('channelAudio').where('root','==','GLOBAL').get().then(snapshotAudioMap).catch(e=>{globalAudioPromise=null;throw e});return globalAudioPromise}
async function loadAudioDocs(root,token){if(loadedAudioRoot===root)return;const [local,shared]=await Promise.all([rootAudioMap(root),globalAudioMap()]);if(token!==switchToken)return;const next=new Map(shared);for(const[id,doc]of local)next.set(id,doc);audioDocsForRoot=next;loadedAudioRoot=root}
function removeCachedBuffer(key){const buffer=buffers.get(key);if(buffer){cachedAudioBytes-=buffer.length*buffer.numberOfChannels*4;buffers.delete(key)}}
function rememberBuffer(key,buffer){removeCachedBuffer(key);const bytes=buffer.length*buffer.numberOfChannels*4;if(bytes>MAX_CACHED_AUDIO_BYTES)return;while(buffers.size>=MAX_CACHED_BUFFERS||cachedAudioBytes+bytes>MAX_CACHED_AUDIO_BYTES)removeCachedBuffer(buffers.keys().next().value);buffers.set(key,buffer);cachedAudioBytes+=bytes}
async function getBuffer(id,root){if(root!==loadedAudioRoot)return null;const doc=audioDocsForRoot.get(id);if(!doc)return null;const key=`${doc.root==='GLOBAL'?'GLOBAL':root}__${id}`;if(buffers.has(key)){const buffer=buffers.get(key);buffers.delete(key);buffers.set(key,buffer);return buffer}if(bufferPromises.has(key))return bufferPromises.get(key);const generation=bufferGenerations.get(key)||0;const promise=decodeAudio(doc.base64).then(buffer=>{if((bufferGenerations.get(key)||0)===generation)rememberBuffer(key,buffer);return buffer}).finally(()=>{if(bufferPromises.get(key)===promise)bufferPromises.delete(key)});bufferPromises.set(key,promise);return promise}
function gainFor(id){const volume=Math.max(0,state.volumes[id]??0);return volume===0?0:volume*.35}
function setGainTarget(param,target,seconds=.05){const now=ctx.currentTime;try{param.cancelAndHoldAtTime(now)}catch{const held=param.value;param.cancelScheduledValues(now);param.setValueAtTime(held,now)}if(target<=0)param.linearRampToValueAtTime(0,now+Math.max(.02,seconds));else param.setTargetAtTime(target,now,seconds)}
function createSeamlessLoop(buffer,destination,rate,voice){const duration=buffer.duration/rate;const crossfade=Math.min(8,Math.max(3,duration*.18));const schedule=(start,oldGain,oldSource)=>{if(voice.stopped)return;const source=ctx.createBufferSource(),cycle=ctx.createGain();source.buffer=buffer;source.playbackRate.value=rate;source.connect(cycle).connect(destination);cycle.gain.setValueAtTime(.0001,start);cycle.gain.linearRampToValueAtTime(1,start+Math.min(1.4,crossfade*.35));source.onended=()=>{voice.sources.delete(source);try{source.disconnect();cycle.disconnect()}catch{}};source.start(start);voice.sources.add(source);if(oldGain&&oldSource){oldGain.gain.cancelScheduledValues(start);oldGain.gain.setValueAtTime(Math.max(.0001,oldGain.gain.value),start);oldGain.gain.linearRampToValueAtTime(.0001,start+crossfade);try{oldSource.stop(start+crossfade+.15)}catch{}}const timer=setTimeout(()=>{voice.timers.delete(timer);schedule(ctx.currentTime+.02,cycle,source)},Math.max(300,(duration-crossfade)*1000));voice.timers.add(timer)};schedule(ctx.currentTime+.03)}
function fadeVoice(v,seconds=.35){v.stopped=true;v.timers.forEach(t=>clearTimeout(t));v.timers.clear();const now=ctx.currentTime,duration=Math.max(.02,seconds);v.gain.gain.cancelScheduledValues(now);v.gain.gain.setValueAtTime(Math.max(0,v.gain.gain.value),now);v.gain.gain.linearRampToValueAtTime(0,now+duration);const stopAt=now+duration+.05;v.sources.forEach(s=>{try{s.stop(stopAt)}catch{}});setTimeout(()=>{try{v.gain.disconnect()}catch{}},(duration+.1)*1000)}
function makeVoice(id,buffer,root){const g=ctx.createGain();g.gain.setValueAtTime(.0001,ctx.currentTime);g.connect(masterNode);const voice={gain:g,sources:new Set(),timers:new Set(),stopped:false};const rate=['cymbals','toms','kick'].includes(id)?1:freq[root]/freq.C;createSeamlessLoop(buffer,g,rate,voice);const target=gainFor(id);if(target>0)g.gain.exponentialRampToValueAtTime(target,ctx.currentTime+.35);else g.gain.setValueAtTime(0,ctx.currentTime);return voice}
async function decodeEnabled(root,token){const ids=channels.filter(c=>(state.volumes[c[0]]||0)>0&&audioDocsForRoot.has(c[0])).map(c=>c[0]);let index=0;const workers=Array.from({length:Math.min(3,ids.length)},async()=>{while(index<ids.length){if(token!==switchToken)return;const id=ids[index++];await getBuffer(id,root)}});await Promise.all(workers)}
async function switchAudio(root){const token=++switchToken;initAudio();const old=voices;voices=new Map();old.forEach(v=>fadeVoice(v,.18));state.playing=true;state.root=root;render();if(ctx.state==='suspended')await ctx.resume();if(token!==switchToken)return;await loadAudioDocs(root,token);if(token!==switchToken||!state.playing||state.root!==root)return;masterNode.gain.cancelScheduledValues(ctx.currentTime);masterNode.gain.setValueAtTime(Math.max(.0001,masterNode.gain.value),ctx.currentTime);masterNode.gain.exponentialRampToValueAtTime(Math.max(.0001,state.master*.42),ctx.currentTime+.3);const ids=channels.filter(c=>(state.volumes[c[0]]||0)>0&&audioDocsForRoot.has(c[0])).map(c=>c[0]);let index=0;const worker=async()=>{while(index<ids.length){if(token!==switchToken)return;const id=ids[index++];try{const buffer=await getBuffer(id,root);if(token!==switchToken||!state.playing||root!==state.root||state.volumes[id]<=0||!buffer||voices.has(id))continue;voices.set(id,makeVoice(id,buffer,root))}catch(e){console.warn('Falha ao carregar canal',id,e)}}};void Promise.all(Array.from({length:Math.min(4,ids.length)},worker))}
function stopAudio(){switchToken++;if(ctx){voices.forEach(v=>fadeVoice(v,.12));voices.clear();masterNode.gain.setTargetAtTime(.0001,ctx.currentTime,.04)}state.playing=false;render()}
async function setChannelVolume(id,value){const request=(channelVolumeTokens.get(id)||0)+1;channelVolumeTokens.set(id,request);state.volumes[id]=value;const label=$(`[data-value="${id}"]`);if(label)label.textContent=Math.round(value*100);let voice=voices.get(id);if(value<=0){if(voice){fadeVoice(voice,.08);voices.delete(id)}return}if(voice){setGainTarget(voice.gain.gain,gainFor(id),.05);return}if(!state.playing)return;const root=state.root,playRequest=switchToken;try{const buffer=await getBuffer(id,root);if(request!==channelVolumeTokens.get(id)||playRequest!==switchToken||!state.playing||root!==state.root||state.volumes[id]<=0||!buffer)return;voice=voices.get(id);if(voice){setGainTarget(voice.gain.gain,gainFor(id),.05);return}voices.set(id,makeVoice(id,buffer,root))}catch(e){console.error('Falha ao carregar canal',id,e)}}
function applyMix(){if(ctx&&masterNode)masterNode.gain.setTargetAtTime(Math.max(.0001,state.master*.42),ctx.currentTime,.05);for(const[id,v]of voices){const target=gainFor(id);if(target===0){fadeVoice(v,.08);voices.delete(id)}else setGainTarget(v.gain.gain,target,.05)}}
function invalidateRoot(root,id){const key=`${root==='GLOBAL'?'GLOBAL':root}__${id}`;bufferGenerations.set(key,(bufferGenerations.get(key)||0)+1);removeCachedBuffer(key);bufferPromises.delete(key);if(root==='GLOBAL')globalAudioPromise=null;else audioDocsByRoot.delete(root);if(loadedAudioRoot===root||root==='GLOBAL'){const active=loadedAudioRoot;loadedAudioRoot=null;audioDocsForRoot.clear();if(active)void loadAudioDocs(active,switchToken).catch(e=>console.warn('Falha ao atualizar cache de áudio',e))}}
async function upload(file){if(!file)return;const msg=$('#message');if(file.size>700000){msg.textContent='Arquivo acima de 700 KB.';return}msg.textContent='Convertendo e salvando...';const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});try{const root=state.selectedRoot,id=state.selectedChannel;await db.collection('channelAudio').doc(`${root}__${id}`).set({root,id,mimeType:file.type||'audio/mpeg',base64,updatedAt:Date.now()});invalidateRoot(root,id);msg.textContent='Áudio salvo no canal correto.';await loadDocs()}catch(e){msg.textContent=e.code==='permission-denied'?'Firestore bloqueado pelas regras.':e.message}}
async function loadDocs(){try{const snap=await db.collection('channelAudio').where('root','==',state.selectedRoot).get();state.audioDocs=snap.docs.map(d=>{const a=d.data();return{root:a.root,id:a.id}});if(state.modal)render()}catch(e){if($('#message'))$('#message').textContent=e.code==='permission-denied'?'Firestore bloqueado pelas regras.':e.message}}
async function bindAudioDelete(id){if(!confirm('Excluir este áudio?'))return;try{await db.collection('channelAudio').doc(`${state.selectedRoot}__${id}`).delete();invalidateRoot(state.selectedRoot,id);await loadDocs()}catch(e){alert(e.message)}}
async function savePreset(){const name=$('#presetName').value.trim();if(!name)return;try{const ref=await db.collection('mixPresets').add({name,root:state.root,master:state.master,volumes:state.volumes,createdAt:Date.now()});state.presets.push({id:ref.id,name,root:state.root,master:state.master,volumes:{...state.volumes}});render()}catch(e){alert(e.code==='permission-denied'?'Firestore bloqueado pelas regras.':e.message)}}
async function loadPresets(){try{const snap=await db.collection('mixPresets').orderBy('createdAt','desc').get();state.presets=snap.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){console.warn('Não foi possível carregar os presets.',e)}}
function reportAudioError(e){console.error('Falha na reprodução do pad:',e);state.playing=false;render();alert('Não foi possível carregar os áudios. Verifique a conexão e tente novamente.')}
function bind(){document.querySelectorAll('[data-root]').forEach(b=>b.onclick=()=>{if(state.playing)void switchAudio(b.dataset.root).catch(reportAudioError);else{state.root=b.dataset.root;render()}});$('#play').onclick=()=>state.playing?stopAudio():void switchAudio(state.root).catch(reportAudioError);$('#stop').onclick=stopAudio;$('#master').oninput=e=>{state.master=+e.target.value;const label=$('.master-head b');if(label)label.textContent=`${Math.round(state.master*100)}%`;if(masterNode)masterNode.gain.setTargetAtTime(Math.max(.0001,state.master*.42),ctx.currentTime,.05)};document.querySelectorAll('[data-channel]').forEach(i=>i.oninput=e=>{void setChannelVolume(e.target.dataset.channel,+e.target.value)});$('#reset').onclick=()=>{channels.forEach(c=>{state.volumes[c[0]]=c[3];const slider=$(`[data-channel="${c[0]}"]`);if(slider)slider.value=c[3];const label=$(`[data-value="${c[0]}"]`);if(label)label.textContent=Math.round(c[3]*100)});applyMix();for(const c of channels)if(c[3]>0&&!voices.has(c[0])&&state.playing)void setChannelVolume(c[0],c[3]);};$('#savePreset').onclick=()=>void savePreset();$('#loadPreset').onchange=e=>{const p=state.presets.find(x=>x.id===e.target.value);if(!p)return;state.master=p.master??.5;Object.assign(state.volumes,p.volumes||{});if(p.root&&!state.playing)state.root=p.root;render();applyMix();if(state.playing)void switchAudio(state.root).catch(reportAudioError)};$('#openAdmin').onclick=()=>{state.modal=true;void loadDocs();render()};if($('#close'))$('#close').onclick=()=>{state.modal=false;render()};if($('#backdrop'))$('#backdrop').onclick=e=>{if(e.target.id==='backdrop'){state.modal=false;render()}};if($('#audioRoot'))$('#audioRoot').onchange=e=>{state.selectedRoot=e.target.value;void loadDocs()};if($('#audioChannel'))$('#audioChannel').onchange=e=>state.selectedChannel=e.target.value;if($('#audioFile'))$('#audioFile').onchange=e=>{void upload(e.target.files[0]);e.target.value=''};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>void bindAudioDelete(b.dataset.delete))}
render();void loadPresets();
</script></body></html>
